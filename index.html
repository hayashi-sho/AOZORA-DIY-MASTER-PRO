['安全','絶対に自己判断しない作業','住宅の電気配線、ガス配管、構造壁の撤去、防水層の貫通などは重大事故に直結します。法令上資格が必要な作業もあります。','コンセント移設や配線変更は有資格者に確認する。','石綿の可能性がある建材は調査せず切断・研磨しない。'],
['安全','壁の裏側を調べる','壁を開ける・穴をあける前に配線、配管、下地、建物の図面を確認します。下地探し器だけで配線や配管の不存在を証明できません。','不明な壁は穿孔しない。','石膏ボード単独に重い物を固定しない。'],

['計測','水平・垂直・直角','水平器で水平と垂直を確認し、差し金で直角を出します。対角線が等しいことも矩形確認の目安です。','製作台が水平か先にチェック。','床・壁そのものが直角とは限らない。'],
['計測','図面の読み方','幅W、奥行D、高さH、板厚tを共通単位mmで管理します。加工後の寸法、材料取り寸法、完成外寸を区別します。','板厚を含む寸法関係を確認する。','刃幅のロスを材料取りに加える。'],
['木工','木材の種類を知る','SPFは扱いやすい一方で節や反りがあります。合板は比較的寸法安定性が高く、MDFは湿気に弱い場合があります。屋外は使用環境に対応する材を選びます。','用途と屋内外で材料を選択。','保護処理なしの屋内材を屋外に使わない。'],
['木工','のこぎりの基本','材料を確実に固定し、切断線の外側を少しずつ切ります。刃の経路に手を置きません。切断途中の材料の落下にも注意します。','刃から手を離す。','初心者は購入店のカットサービスを活用。'],
['木工','下穴とビス締め','ビス径や木材に応じて下穴を検討し、端割れを防ぎます。締めすぎはネジ山を傷めるのでトルクを調整します。','端材で下穴と締付を練習する。','ねじの長さが相手材を貫通しないか確認。'],

['壁','石膏ボードと下地','壁掛け品は重量、荷重方向、下地やアンカーの仕様が重要です。石膏ボード用アンカーの表示耐荷重も実際の壁条件と一致する必要があります。','荷重を伴う設置は適合確認。','テレビなど重量物は専門家に相談。'],

/* Maximal-rectangles candidate search: deterministic, non-optimal; excludes overlap with kerf spacing. */
function packBoards(parts,sw,sh,kerf,rotate){
 const pending=[...parts].sort((a,b)=>Math.max(b.w,b.h)-Math.max(a.w,a.h)||b.w*b.h-a.w*a.h);
 let boards=[];for(const part of pending){let placed=false;
 for(let k=0;k<=boards.length;k++){
  let board=boards[k]||{pieces:[]};let candidates=[{x:0,y:0}];
  for(const q of board.pieces){candidates.push({x:q.x+q.w+kerf,y:q.y},{x:q.x,y:q.y+q.h+kerf})}
  candidates.sort((a,b)=>a.y-b.y||a.x-b.x);
  for(const pos of candidates){for(const flip of (rotate?[false,true]:[false])){
   let w=flip?part.h:part.w,h=flip?part.w:part.h;
   if(pos.x+w>sw+1e-8||pos.y+h>sh+1e-8)continue;
   if(board.pieces.some(q=>pos.x<q.x+q.w+kerf&&pos.x+w+kerf>q.x&&pos.y<q.y+q.h+kerf&&pos.y+h+kerf>q.y))continue;
   board.pieces.push({...part,x:pos.x,y:pos.y,w,h,flip});if(k===boards.length)boards.push(board);placed=true;break;
  }if(placed)break}
  if(placed)break;
 }
 if(!placed)return {error:'板材に収まらない部材があります：'+part.name+'（'+part.w+'×'+part.h+'mm）。板材サイズや回転条件を見直してください。',boards};
 }

}

function view3d(){let d=data.design,m=designMath();if(!m.valid)return heading('3D組立イメージ','設計寸法の確認')+'<div class="notice">設計ページで有効な寸法を入力してください。</div>';

 const scale=240/Math.max(d.w,d.d,d.h),c=Math.cos(theta),sn=Math.sin(theta),ct=Math.cos(tilt),st=Math.sin(tilt);
 function proj(x,y,z){return [220+scale*(x*c-y*sn),225+scale*(x*sn*st+y*c*st-z*ct)]}
 function face(v,fill){return `<polygon points="${v.map(p=>proj(...p).map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="${fill}" stroke="#71563b" stroke-width="1.3"/>`}

 let t=d.t,shape='';if(d.type==='shelf'){shape+=cube(0,0,0,t,d.d,d.h)+cube(d.w-t,0,0,t,d.d,d.h)+cube(t,0,0,d.w-2*t,d.d,t)+cube(t,0,d.h-t,d.w-2*t,d.d,t);for(let i=1;i<=d.n;i++)shape+=cube(t,0,t+(d.h-2*t)*i/(d.n+1),d.w-2*t,d.d,t)}else{shape+=cube(0,0,0,d.w,t,d.h)+cube(0,d.d-t,0,d.w,t,d.h)+cube(0,t,0,t,d.d-2*t,d.h)+cube(d.w-t,t,0,t,d.d-2*t,d.h)+cube(t,t,0,d.w-2*t,d.d-2*t,t)}

function ensureV4(){
 if(!Array.isArray(data.savedDesigns))data.savedDesigns=[];
 if(!Array.isArray(data.customParts))data.customParts=[{name:'側板',w:400,h:250,qty:2},{name:'棚板',w:564,h:250,qty:2}];

}

function snapshotDesign(){ensureV4();let name=prompt('保存する設計名（最大40文字）',data.design.type==='shelf'?'オリジナル棚':'オリジナル木箱');if(name===null)return;name=name.trim().slice(0,40);if(!name)return alert('設計名を入力してください');if(data.savedDesigns.length>=50)return alert('設計保存は最大50件です。');data.savedDesigns.unshift({id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),name,design:structuredClone(data.design),created:new Date().toISOString()});save();navgo('mydesigns')}
function useSnapshot(id){let item=data.savedDesigns.find(x=>x.id===id);if(!item)return;data.design=JSON.parse(JSON.stringify(item.design));save();navgo('design')}
function removeSnapshot(id){if(!confirm('この設計を削除しますか？'))return;data.savedDesigns=data.savedDesigns.filter(x=>x.id!==id);save();render()}
function mydesigns(){ensureV4();return heading('保存した設計','設計を名前付きで保存 / 再編集 / 部材リストに転送')+`<div class="card noprint"><p>設計スタジオで作った棚・木箱の寸法を保存できます。保存時点の条件が記録され、あとから復元できます。</p><div class="inline">${btn('現在の設計を保存','snapshotDesign()')}${btn('設計スタジオへ',"navgo('design')",'ghost')}</div></div><h2 class="section">保存済み ${data.savedDesigns.length} 件</h2><div class="grid">${data.savedDesigns.map(i=>`<article class="card"><h3>${esc(i.name)}</h3><p class="muted small">${esc(i.created.slice(0,10))} · ${i.design.type==='shelf'?'棚':'木箱'}</p><p>${esc(i.design.w)} × ${esc(i.design.d)} × ${esc(i.design.h)} mm</p><div class="inline">${btn('設計を開く',`useSnapshot('${i.id}')`)}${btn('削除',`removeSnapshot('${i.id}')`,'danger')}</div></article>`).join('')||'<div class="card">まだ設計がありません。設計スタジオで保存してください。</div>'}</div>`}
function updateCustom(k,v){ensureV4();data.customSettings[k]=k==='rotate'?!!v:Number(v);save();render()}

function addCustomPart(){ensureV4();if(data.customParts.length>=40)return alert('部品種類は最大40件です');data.customParts.push({name:'新しい部品',w:300,h:200,qty:1});save();render()}

function syncFromDesign(){const m=designMath();if(!m.valid)return alert('設計の寸法を確認してください');data.customParts=m.rows.map(r=>({name:r[0],w:r[1],h:r[2],qty:r[3]}));data.customSettings.boardW=data.design.boardW;data.customSettings.boardH=data.design.boardL;data.customSettings.price=data.design.price;save();navgo('customcut')}
function calcCustom(){ensureV4();let a=data.customSettings;let good=Object.values(a).filter(x=>typeof x==='number').every(Number.isFinite)&&a.boardW>0&&a.boardH>0&&a.boardW<=5000&&a.boardH<=6000&&a.price>=0&&a.kerf>=0&&a.kerf<=20&&a.edge>=0&&a.edge<=100&&a.boardW-2*a.edge>0&&a.boardH-2*a.edge>0;
 let ps=[];for(let p of data.customParts){if(!p.name.trim()||!Number.isFinite(p.w)||!Number.isFinite(p.h)||!Number.isInteger(p.qty)||p.w<=0||p.h<=0||p.w>6000||p.h>6000||p.qty<1||p.qty>30)good=false;else for(let i=0;i<p.qty;i++)ps.push({name:p.name+(p.qty>1?' '+(i+1):''),w:p.w,h:p.h})}
 if(ps.length>250)good=false;
 return good&&ps.length?packBoards(ps,a.boardW-2*a.edge,a.boardH-2*a.edge,a.kerf,a.rotate):{error:'寸法・数量の入力を確認してください（部品最大250個）。',boards:[]};}
function customcut(){ensureV4();let a=data.customSettings,r=calcCustom(),good=!r.error;let parts=data.customParts;let svgs=good?r.boards.map((b,i)=>{let uw=a.boardW-2*a.edge,uh=a.boardH-2*a.edge,sc=Math.min(550/uw,330/uh),w=uw*sc,h=uh*sc;return `<div class="card"><h3>板材 ${i+1}</h3><div class="svgarea"><svg viewBox="0 0 ${w+16} ${h+16}" role="img" aria-label="板材${i+1}の配置"><rect x="8" y="8" width="${w}" height="${h}" fill="#f2e6cc" stroke="#806642"/>${b.pieces.map((p,j)=>`<rect x="${8+p.x*sc}" y="${8+p.y*sc}" width="${p.w*sc}" height="${p.h*sc}" fill="${['#c3e2ce','#d4d7ed','#e9d4bd','#d4eaca'][j%4]}" stroke="#5f776a"/><text x="${8+(p.x+p.w/2)*sc}" y="${8+(p.y+p.h/2)*sc}" text-anchor="middle" dominant-baseline="middle" font-size="${Math.max(6,Math.min(11,p.w*sc/6))}">${j+1}</text>`).join('')}</svg></div><div class="small muted">${b.pieces.map((p,j)=>`${j+1}: ${esc(p.name)} ${p.w}×${p.h}mm`).join(' / ')}</div></div>`}).join(''):'';
 return heading('自由木取りスタジオ','好きな部品サイズから板取りを概算 / 材料費・CSV出力')+`<div class="notice">配置は矩形部品の近似アルゴリズムです。最小枚数・直線切断可能性・木目・欠点・固定方法を保証しません。実加工用の指示書には使わず、現物と加工手順を確認してください。</div><div class="grid two"><section class="card noprint"><h2>板材条件</h2><div class="grid two">${[['boardW','板材幅 (mm)'],['boardH','板材長さ (mm)'],['price','1枚の価格 (円)'],['kerf','切りしろ (mm)'],['edge','各辺余白 (mm)']].map(([k,l])=>`<label class="field">${l}<input type="number" min="0" step="${k==='kerf'?'0.5':'1'}" value="${esc(a[k])}" onchange="updateCustom('${k}',this.value)"></label>`).join('')}</div><label class="checklist"><input type="checkbox" ${a.rotate?'checked':''} onchange="updateCustom('rotate',this.checked)">90°回転を許可（木目方向に注意）</label><div class="inline">${btn('設計から部品を転送','syncFromDesign()','ghost')}${btn('部品を追加','addCustomPart()')}</div></section><section class="card"><h2>板取り結果</h2>${!good?`<div class="notice">${esc(r.error)}</div>`:`<div class="stat">${r.boards.length} 枚</div><p>板材費：<b>${yen(r.boards.length*a.price)}</b></p><div class="rowline"><span>部品総数</span><b>${r.boards.reduce((n,b)=>n+b.pieces.length,0)}個</b></div><div class="rowline"><span>利用可能面積に対する部品面積比</span><b>${fmt(100*r.boards.flatMap(b=>b.pieces).reduce((n,p)=>n+p.w*p.h,0)/(r.boards.length*(a.boardW-2*a.edge)*(a.boardH-2*a.edge)))}%</b></div><div class="inline noprint">${btn('カットリストCSV','exportCustomCut()')}${btn('板材を購入リストへ','addCustomBoardsToShopping()','ghost')}${btn('印刷','window.print()','ghost')}</div>`}</section></div><div class="card noprint" style="margin-top:15px"><div class="between"><h2>部品リスト</h2><span class="pill">${parts.length} 種類</span></div><div class="tablewrap"><table class="tbl"><thead><tr><th>名称</th><th>幅 mm</th><th>長さ mm</th><th>数量</th><th>操作</th></tr></thead><tbody>${parts.map((p,i)=>`<tr><td><input aria-label="部品名" value="${esc(p.name)}" onchange="editCustomPart(${i},'name',this.value)"></td>${['w','h','qty'].map(k=>`<td><input aria-label="${k}" type="number" min="1" step="1" value="${esc(p[k])}" onchange="editCustomPart(${i},'${k}',this.value)"></td>`).join('')}<td>${btn('削除',`deleteCustomPart(${i})`,'danger')}</td></tr>`).join('')}</tbody></table></div></div><div class="grid two" style="margin-top:15px">${svgs}</div>`}

function exportShopping(){if(!data.shopping.length)return alert('品目がありません');csv('aozora-diy-shopping.csv',[['品名','数量','単価円','小計円','購入済み','メモ'],...data.shopping.map(i=>[i.name,i.qty,i.unit,i.qty*i.unit,i.done?'済':'未',i.notes])])}

 measure:{name:'メジャー・差し金',purpose:'同じ基準端から測り、寸法と直角を確認',how:'基準端・材料の表裏・木目方向を決めて、部品番号ごとに2回測定。',check:['寸法の単位と基準端が一致','差し金が材料に正しく密着','墨線の残す側／落とす側を区別'],caution:'反りのある材では一か所の測定だけで決めない。'},
 saw:{name:'手のこ・材料カットサービス',purpose:'指定された部材を安全に寸法取りする準備',how:'初心者は店舗のカットサービスを優先。自分で切断する場合は工具の取扱説明書を確認し材料を固定。',check:['工具の種類と材料厚が適合','材料を固定できる','刃の経路から手を離せる'],caution:'切断順序は本アプリでは確定しません。回転刃工具の操作は製品指定の安全方法に従う。'},
 drill:{name:'ドリルドライバー',purpose:'メーカー指定の下穴・締付条件を守る',how:'使用ねじ・母材・金物に適した下穴の径と深さをメーカー資料で確認し、端材で試す。',check:['下穴径と深さをメーカー資料で照合','配線・配管・裏側の干渉なし','材料と工具を確実に固定'],caution:'下穴位置や径を自動決定しません。ねじの貫通・端割れに注意。'},
 clamp:{name:'クランプ',purpose:'仮組み時のズレを抑える',how:'接合面を揃え、当て木を使って均等に固定。歪みや寸法変化を確認する。',check:['当て木で表面を保護','部材を変形させない締付','加工中に動かない固定'],caution:'クランプだけで恒久的な荷重支持はできません。'},
 sander:{name:'紙やすり・集じん',purpose:'ささくれ除去と仕上げ準備',how:'端材で目の粗さを確認し、粉じんを集じんしながら木目方向に研磨。',check:['防じん対策と換気','塗膜・材質の有害性を確認','角の削り過ぎなし'],caution:'古い塗膜・不明建材を安易に研磨しない。'}
};
const V20_CUT_GATES=[
 ['dimensions','外寸・板厚・木目方向・部材表が現物と一致'],
 ['material','反り・節・割れ・欠け・湿りの状態を確認'],
 ['layout','刃幅と余白を考慮し、材料へ墨付け済み'],
 ['support','材料の固定方法と切り落とし側の支持を確認'],
 ['equipment','工具と刃の適合、保護具、周囲の人を確認'],
 ['safety','不明な接合強度・固定箇所は加工前に確認']
];
function v20Init(){
 if(!data.v20||typeof data.v20!=='object')data.v20={tool:'measure',joint:0,part:0,gates:{},notes:{}};
 if(!data.v20.gates||typeof data.v20.gates!=='object')data.v20.gates={};
 if(!data.v20.notes||typeof data.v20.notes!=='object')data.v20.notes={};
 if(!V20_TOOLS[data.v20.tool])data.v20.tool='measure';
 data.v20.joint=Math.max(0,Math.min(1,Number(data.v20.joint)||0));
 data.v20.part=Math.max(0,Math.trunc(Number(data.v20.part)||0));
}
function v20Change(which,value){v20Init();if(which==='tool'&&V20_TOOLS[value])data.v20.tool=value;if(which==='joint')data.v20.joint=Math.max(0,Math.min(1,Number(value)||0));if(which==='part')data.v20.part=Math.max(0,Math.trunc(Number(value)||0));save();render();document.getElementById('v20-workbench')?.scrollIntoView({block:'start'});}
function v20Gate(scope,id,checked){v20Init();data.v20.gates[scope+':'+id]=!!checked;save();render();document.getElementById('v20-workbench')?.scrollIntoView({block:'start'});}
function v20Note(scope,value){v20Init();data.v20.notes[scope]=String(value).slice(0,1200);save();}
function v20JointSvg(type){
 const base='<svg viewBox="0 0 440 250" width="100%" role="img" aria-label="接合部拡大模式図。穴あけ位置・金物寸法は示しません"><rect width="440" height="250" rx="12" fill="#f6f1e8"/>';
 const rect=(x,y,w,h,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${c}" stroke="#76543a" stroke-width="2"/>`;
 let shapes='',desc='';
 if(type==='leg'){shapes=rect(120,35,64,180,'#bc8652')+rect(184,75,169,44,'#deb481')+'<circle cx="185" cy="97" r="27" fill="none" stroke="#16826a" stroke-width="3" stroke-dasharray="7 4"/>';desc='脚と幕板の接合候補';}
 else if(type==='shelf'){shapes=rect(108,28,43,185,'#bc8652')+rect(151,95,190,28,'#deb481')+'<rect x="152" y="125" width="45" height="9" fill="#16826a" opacity=".8"/>';desc='側板と棚板の支持候補';}
 else if(type==='top'){shapes=rect(76,49,292,35,'#deb481')+rect(120,84,43,117,'#bc8652')+rect(163,104,170,39,'#cfa06c')+'<circle cx="164" cy="95" r="24" fill="none" stroke="#16826a" stroke-width="3" stroke-dasharray="7 4"/>';desc='天板と下部構造の接合候補';}
 else if(type==='floor'){shapes=rect(105,35,40,170,'#bc8652')+rect(145,145,210,27,'#deb481')+'<circle cx="149" cy="156" r="25" fill="none" stroke="#16826a" stroke-width="3" stroke-dasharray="7 4"/>';desc='底板と側板の支持候補';}
 else {shapes=rect(105,34,47,170,'#bc8652')+rect(152,153,205,42,'#deb481')+'<circle cx="153" cy="171" r="28" fill="none" stroke="#16826a" stroke-width="3" stroke-dasharray="7 4"/>';desc='直角の突き合わせ接合候補';}
 return base+shapes+`<text x="220" y="228" text-anchor="middle" fill="#5d4634" font-size="14">${desc}　緑＝要確認箇所</text></svg>`;
}
function v20WorkBench(){
 v20Init();v18Init();const {kind,d,m}=v13Current(),audit=v13Audit(kind,d,m);
 if(audit.blockers.length)return `<div class="card" id="v20-workbench"><h2>v20 加工準備・図解ナビ</h2><p class="notice">寸法・設計のエラーを先に修正してください。${audit.blockers.map(esc).join(' / ')}</p></div>`;
 const blocks=v19Blocks(kind,d,m),summary=v19PartSummary(blocks,m);
 if(!summary.valid||!summary.matched)return `<div class="card" id="v20-workbench"><h2>v20 加工準備・図解ナビ</h2><p class="notice">部材データが不整合のため図解を停止しました。</p></div>`;
 const scope=v13Key(kind,d),selected=Math.min(data.v20.part,blocks.length-1),part=blocks[selected],jointNo=data.v20.joint,joint=V18_JOINTS[kind][jointNo],jointMethod=data.v18.methods[scope+':'+jointNo]||'screw',method=V18_METHODS[jointMethod],tool=V20_TOOLS[data.v20.tool];
 const count=V20_CUT_GATES.filter(([id])=>data.v20.gates[scope+':'+id]).length;
 const fmtPart=p=>`${fmt(p.sx)} × ${fmt(p.sy)} × ${fmt(p.sz)} mm`;
 return `<h2 class="section" id="v20-workbench">v20.0 加工準備・接合拡大図・工具ガイド</h2>
 <div class="card"><p class="notice"><b>図は教育用の模式図です。</b>固定位置・下穴寸法・金物仕様・耐荷重・安全な切断順序は確定しません。切断・施工は現物とメーカー資料で検証してください。</p><h3>① 部品番号と加工前の現物照合</h3><label class="field">図解する部材<select onchange="v20Change('part',this.value)">${blocks.map((p,i)=>`<option value="${i}" ${selected===i?'selected':''}>P${String(i+1).padStart(2,'0')} ${esc(p.name)}：${fmtPart(p)}</option>`).join('')}</select></label><div class="info"><b>P${String(selected+1).padStart(2,'0')} ${esc(part.name)}</b>　参考3軸寸法 ${fmtPart(part)}<br>工程 ${part.phase+1}/7：${esc(V19_STAGES[part.phase])}。板材の実際の切断長さ・幅はv11部材表を優先して照合してください。</div><div class="inline">${btn('工程アニメーションを確認',"document.getElementById('v19-assembly')?.scrollIntoView({behavior:'smooth'})",'ghost')}${btn('部材検品を確認',"document.getElementById('v20-cut')?.scrollIntoView({behavior:'smooth'})",'ghost')}</div></div>
 <div class="card" style="margin-top:16px"><h3>② 接合部を拡大して確認</h3><label class="field">接合ポイント<select onchange="v20Change('joint',this.value)">${V18_JOINTS[kind].map((j,i)=>`<option value="${i}" ${jointNo===i?'selected':''}>${esc(j[0])}</option>`).join('')}</select></label><div class="svgarea">${v20JointSvg(joint[1])}</div><div class="info"><b>${esc(joint[0])}</b>：${esc(joint[2])}<br>選択中の接合候補：${esc(method.label)}<br>確認事項：${esc(joint[4])}</div><h4>採用を検討する金物・固定方法</h4><p>${esc(method.purpose)}。${esc(method.risks)}</p><ul>${method.needs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="small muted">固定部の荷重や下穴の数値はメーカー資料・現物を確認してから決定してください。</p>${btn('接合条件のチェック画面へ',"document.getElementById('v18-joint')?.scrollIntoView({behavior:'smooth'})",'ghost')}</div>
 <div class="card" style="margin-top:16px"><h3>③ 初心者向け工具ガイド</h3><label class="field">工具を選択<select onchange="v20Change('tool',this.value)">${Object.entries(V20_TOOLS).map(([k,t])=>`<option value="${k}" ${data.v20.tool===k?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><h4>${esc(tool.name)}</h4><p><b>目的：</b>${esc(tool.purpose)}</p><p><b>作業方法：</b>${esc(tool.how)}</p><ul>${tool.check.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p class="notice"><b>注意：</b>${esc(tool.caution)}</p></div>
 <div class="card" id="v20-cut" style="margin-top:16px"><h3>④ 切断前チェックシート</h3><p>設計：${esc(V11_TEMPLATES[kind].name)} / 板材 ${fmt(d.boardW)} × ${fmt(d.boardL)} mm・刃幅 ${fmt(d.kerf)} mm・余白 ${fmt(d.edge)} mm</p><p>確認 ${count}/${V20_CUT_GATES.length}。チェックは本人による確認記録であり、安全性の認定ではありません。</p>${V20_CUT_GATES.map(([id,label])=>`<label class="checklist"><input type="checkbox" onchange="v20Gate('${scope}','${id}',this.checked)" ${data.v20.gates[scope+':'+id]?'checked':''}><span>${esc(label)}</span></label>`).join('')}<p class="${count===V20_CUT_GATES.length?'info':'notice'}">${count===V20_CUT_GATES.length?'6項目の自己確認を記録しました。実際の切断前に現物を再確認してください。':'未確認項目があります。切断・材料発注を急がず照合してください。'}</p><label class="field">確認したメーカー資料・未解決事項<textarea rows="3" maxlength="1200" oninput="v20Note('${scope}',this.value)">${esc(data.v20.notes[scope]||'')}</textarea></label><div class="inline">${btn('切断前チェックCSV','v20Export()','ghost')}${btn('印刷 / PDF','window.print()','ghost')}</div></div>`;
}
function v20Export(){v20Init();const {kind,d,m}=v13Current(),a=v13Audit(kind,d,m);if(a.blockers.length)return alert('設計エラーを修正してください');const blocks=v19Blocks(kind,d,m),check=v19PartSummary(blocks,m);if(!check.valid||!check.matched)return alert('部材数の照合ができません');const scope=v13Key(kind,d);const rows=[['AOZORA DIY MASTER PRO v20 切断前チェック'],['作品',V11_TEMPLATES[kind].name],['外寸(mm)',d.w,d.d,d.h],['注記','教育用参考資料。安全性・加工順序・固定具は未検証'],[],['部品番号','名称','組立X(mm)','組立Y(mm)','組立Z(mm)','導入工程']];blocks.forEach((p,i)=>rows.push(['P'+String(i+1).padStart(2,'0'),p.name,p.sx,p.sy,p.sz,V19_STAGES[p.phase]]));rows.push([],['チェック項目','自己確認']);V20_CUT_GATES.forEach(([id,label])=>rows.push([label,data.v20.gates[scope+':'+id]?'確認済':'未確認']));rows.push(['作業メモ',data.v20.notes[scope]||'']);csv('AOZORA_DIY_v20_check_'+kind+'.csv',rows)}
const v20PreviousStudio=v11Page;v11Page=function(){return v20PreviousStudio()+v20WorkBench()};
const v20PreviousHome=home;home=function(){return v20PreviousHome()+`<div class="card" style="margin-top:16px"><h3>🧰 v20.0 加工準備・拡大図ガイド</h3><p>接合部の拡大模式図・工具別確認事項・切断前6項目チェックを5作品に追加しました。</p>${btn('加工準備ガイドへ',"navgo('woodstudio');document.getElementById('v20-workbench')?.scrollIntoView({behavior:'smooth'})")}</div>`};
const v20Footer=document.querySelector('.sidefoot');if(v20Footer)v20Footer.innerHTML='v20.0 / ローカル保存対応<br>© AOZORA.';
v20Init();

</script></body></html>
